<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
</head>

<body>
    <h1>Website Feedback Form</h1>

    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br>
        <label for="email">E-mail:</label><br>
        <input type="text" id="email" name="email" required><br>
   
        <p>How would you rate your experience?</p>
        <input type="radio" id="excellent" name="raiting"> <label for="excellent">Excellent</label><br>
        <input type="radio" id="good" name="rating"> <label for="good">Good</label><br>
        <input type="radio" id="poor" name="raiting"> <label for="poor">Poor</label><br>
    
        <p>Which features did you use?</p>
        <input type="checkbox" id="blog" name="feature"> <label for="blog">Blog</label><br>
        <input type="checkbox" id="forum" name="feature"> <label for="forum">Forum</label><br>
        <input type="checkbox" id="doc" name="feature"> <label for="doc">Documentation</label><br>
   
        <p><label for="improve">What would you like us to improve?</label></p>
        <select id="features" name="features">
            <option value="design">Design</option>
            <option value="colors">Colors</option>
            <option value="animation">Animation</option>
            <option value="scripts">Scripts</option>
        </select>        
    
        <p>Additional Comments:</p>
        <textarea name="comments" rows="10" cols="45">

        </textarea>
    
        <p><button type="button" onclick="alert('Thank you for your sumbission!')">Submit Feedback</button></p>
    </form>
</body>

</html>
